name: Build Custom WSL2 Kernel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Linux Kernel
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      KERNEL_URL: https://github.com/torvalds/linux/archive/refs/tags/v7.4-rc1.zip
      KERNEL_DIR: kernel-source
      CONFIG_FILE: configs/config-wsl.MAIN

    steps:
      - name: Checkout Your Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            flex \
            bison \
            libssl-dev \
            libelf-dev \
            libncurses-dev \
            bc \
            cpio \
            kmod \
            dwarves \
            git \
            curl \
            unzip

      - name: Download Linux Kernel Source
        run: |
          set -euo pipefail

          curl -fL "$KERNEL_URL" -o linux-kernel.zip

          unzip -q linux-kernel.zip

          mv linux-7.4-rc1 "$KERNEL_DIR"

          rm linux-kernel.zip

          echo "Kernel source: v7.4-rc1"
          echo "Kernel release: $(make -s -C "$KERNEL_DIR" kernelrelease)"

      - name: Configure Kernel
        run: |
          set -euo pipefail

          test -f "$CONFIG_FILE"

          cp "$CONFIG_FILE" "$KERNEL_DIR/.config"

          make -C "$KERNEL_DIR" olddefconfig

      - name: Compile Kernel
        run: |
          set -euo pipefail

          make -C "$KERNEL_DIR" \
            -j"$(nproc)" \
            bzImage

          test -s "$KERNEL_DIR/arch/x86/boot/bzImage"

      - name: Prepare Artifacts
        run: |
          set -euo pipefail

          mkdir -p dist

          cp "$KERNEL_DIR/arch/x86/boot/bzImage" dist/bzImage

          echo "v7.4-rc1" > dist/kernel-version.txt

          echo "$KERNEL_URL" > dist/kernel-source.txt

          make -s -C "$KERNEL_DIR" kernelrelease \
            > dist/kernel-release.txt

          sha256sum dist/bzImage > dist/bzImage.sha256

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xanmod7.4-rc1
          path: dist/
          if-no-files-found: error
          retention-days: 30
